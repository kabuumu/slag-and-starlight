name: Build & Deploy Web Player

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.3
  GODOT_RELEASE: 4.3-stable
  GODOT_TEMPLATE_DIR: 4.3.stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Godot binaries & templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            /tmp/godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATE_DIR }}
          key: godot-${{ env.GODOT_RELEASE }}-web

      - name: Install Godot ${{ env.GODOT_RELEASE }} & export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/godot ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATE_DIR }}
          curl -sSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_RELEASE }}/Godot_v${{ env.GODOT_RELEASE }}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v${{ env.GODOT_RELEASE }}_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot
          rm /tmp/godot.zip

          curl -sSL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_RELEASE }}/Godot_v${{ env.GODOT_RELEASE }}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates_extract
          mv /tmp/templates_extract/templates/* ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATE_DIR }}/
          rm -rf /tmp/templates.tpz /tmp/templates_extract

      - name: Run project validator
        run: python3 tests/validate_project.py

      - name: Import project resources
        run: /tmp/godot/godot --headless --import --quit

      - name: Export Web build
        run: |
          mkdir -p build/web
          /tmp/godot/godot --headless --export-release "Web" build/web/index.html

      - name: Upload Web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: slag-and-starlight-web
          path: build/web

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
